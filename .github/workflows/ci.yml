name: CI

on:
  pull_request:
  push:
    branches: [main]

# 権限は読み取りだけ。秘密は使わない (docs/design.md §8)。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型検査・単体テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # カード v3 の検査 (card-*・anomaly-min-deviation の shortfalls) を、全難易度で致命にする (docs/test-cases/cards.md §11・docs/test-cases/ci.md C3c)。
      # やさしいは #139 が --require-cards=easy で、むずかしいは #140 が足した。CLI は最初の --require-cards だけを読むので、値なしの 1 つにする (2 つ並べると後ろが黙って外れる)
      - run: npm run verify:data -- --require-complete --require-cards
      - run: npm run build
      - run: npm run check:size

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
