name: CI

on:
  pull_request:
  push:
    branches: [main]

# 権限は読み取りだけ。秘密は使わない (docs/design.md §8)。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型検査・単体テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # カード v3 の検査 (card-*・anomaly-min-deviation の shortfalls) を致命にする (docs/test-cases/cards.md §11)。
      # むずかしいは #140 で --require-cards=hard を足した (カードの検査 0 件)。やさしいは #139 の完了時に --require-cards=easy を足して全難易度 (--require-cards) にする
      - run: npm run verify:data -- --require-complete --require-cards=hard
      - run: npm run build
      - run: npm run check:size

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
